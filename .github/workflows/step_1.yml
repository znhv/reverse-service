name: Go

on:
  push:
    branches: [ main ]

jobs:

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.21.1
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.1

      - name: Check out
        uses: actions/checkout@v2

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -o main

      - name: Test
        run: go test -v
  build_macos:
    runs-on: macos-latest
    steps:
      - name: Set up Go 1.21.1
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.1

      - name: Check out
        uses: actions/checkout@v2

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -o main

      - name: Test
        run: go test -v
  build_windows:
    runs-on: windows-latest
    steps:
      - name: Set up Go 1.21.1
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.1

      - name: Check out
        uses: actions/checkout@v2

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -o main

      - name: Test
        run: go test -v